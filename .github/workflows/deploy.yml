name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Merge extra files into the site folder
        run: |
          if [ -d back40/back40-missing-pages ]; then
            cp -r back40/back40-missing-pages/. back40/
            rm -rf back40/back40-missing-pages back40/back40-missing-pages.zip
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: back40
      - id: deployment
        uses: actions/deploy-pages@v4
